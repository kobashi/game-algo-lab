<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BGM 切替方式（即時・クロスフェード・拍同期）の比較。" />
  <title>BGM 切替方式の比較 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="bgm-transition-compare"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / サウンド / BGM 切替</p>
      <h1>BGM 切替方式の比較</h1>
      <p class="page-header-lead">
        <strong>即時</strong> / <strong>クロスフェード</strong> / <strong>拍同期フェード</strong>で曲 A↔B を切替。
        前段: <a href="bgm-loop.html">BGM ループ</a> ·
        <a href="bgm-quantize.html">量子化</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>即時切替は実装が簡単だが聴感が硬い</li>
          <li>クロスフェードは両曲の gain を線形交差</li>
          <li>拍同期は次小節頭からフェードを開始する</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="tr-canvas" class="gl-canvas" width="720" height="220"></canvas>
        <div id="tr-meters" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="control-row">
          <button type="button" id="btn-play" class="btn btn-primary">再生</button>
          <button type="button" id="btn-switch" class="btn btn-ghost">A ↔ B 切替</button>
        </div>
        <label class="controls-label" for="mode">方式</label>
        <select id="mode" class="bandit-select">
          <option value="immediate">即時切替</option>
          <option value="crossfade" selected>クロスフェード</option>
          <option value="beat">拍同期フェード</option>
        </select>
        <label class="controls-label" for="fade-sec">フェード秒 <span id="fade-val">1.2</span></label>
        <input type="range" id="fade-sec" class="ttt-range" min="0.2" max="3" value="1.2" step="0.1" />
        <label class="controls-label" for="bpm">BPM <span id="bpm-val">120</span></label>
        <input type="range" id="bpm" class="ttt-range" min="60" max="180" value="120" />
        <label class="ttt-check"><input type="checkbox" id="mute" /> ミュート（メーターのみ）</label>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Audio · BGM 切替"></footer>
  <script type="module" src="../js/bgm-transition-compare.js"></script>
</body>
</html>
