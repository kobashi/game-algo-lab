<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="サウンドバスとダッキングの可視化。" />
  <title>サウンドバスとダッキング — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="audio-bus-ducking"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / サウンド / バスとダッキング</p>
      <h1>サウンドバスとダッキング</h1>
      <p class="page-header-lead">
        Master の下に <strong>BGM / SE</strong> バス。SE 再生中は BGM を一時減衰（ダック）。
        前段: <a href="sfx-events.html">イベントと効果音</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>バスごとにゲインを分けて制御する</li>
          <li>重要な SE のとき BGM を attack→hold→release で下げる</li>
          <li>Master × Bus の階層</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <h2 class="gl-block-title">メーター</h2>
        <div id="bus-meters" class="coord-readout"></div>
        <h2 class="gl-block-title">ログ</h2>
        <div id="bus-log" class="es-log-panel" role="log"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="control-row">
          <button type="button" id="btn-bgm" class="btn btn-primary">BGM 再生</button>
          <button type="button" id="btn-se" class="btn btn-ghost">SE 発火</button>
        </div>
        <label class="controls-label" for="master-gain">Master <span id="master-val">0.90</span></label>
        <input type="range" id="master-gain" class="ttt-range" min="0" max="1" value="0.9" step="0.05" />
        <label class="controls-label" for="bgm-gain">BGM バス <span id="bgm-val">0.55</span></label>
        <input type="range" id="bgm-gain" class="ttt-range" min="0" max="1" value="0.55" step="0.05" />
        <label class="controls-label" for="se-gain">SE バス <span id="se-val">0.80</span></label>
        <input type="range" id="se-gain" class="ttt-range" min="0" max="1" value="0.8" step="0.05" />
        <label class="ttt-check"><input type="checkbox" id="mute" /> ミュート（メーターのみ）</label>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Audio · バス / ダック"></footer>
  <script type="module" src="../js/audio-bus-ducking.js"></script>
</body>
</html>
