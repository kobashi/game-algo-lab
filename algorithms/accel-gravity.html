<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加速度と重力 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="physics" data-active="accel-gravity"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 物理・判定 / 加速度と重力</p>
      <h1>加速度と重力</h1>
      <p class="page-header-lead">
        <strong>v ← v + g·dt</strong> のあと <strong>p ← p + v·dt</strong>。
        前段: <a href="velocity-motion.html">速度による移動</a>（加速度なし）。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>重力は毎フレーム速度に足す加速度</li>
          <li>軌跡が放物線になる（一定 vx + 下向き g）</li>
          <li>床バウンスは vy を反転×反発係数</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="ag-canvas" class="gl-canvas" width="640" height="360"></canvas>
        <p id="ag-readout" class="obs-readout"></p>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="controls-group-paint gl-params">
          <div class="control-row">
            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-step" class="btn btn-ghost">1ステップ</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
          </div>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="g">重力 g <span id="g-val">600</span></label>
          <input type="range" id="g" class="ttt-range" min="0" max="1200" value="600" step="20" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="vx">水平 vx <span id="vx-val">120</span></label>
          <input type="range" id="vx" class="ttt-range" min="-240" max="240" value="120" step="5" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="restitution">反発 <span id="rest-val">0.75</span></label>
          <input type="range" id="restitution" class="ttt-range" min="0" max="1" value="0.75" step="0.05" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="speed">再生速度 <span id="speed-val">1.0</span>×</label>
          <input type="range" id="speed" class="ttt-range" min="0.1" max="1" value="1" step="0.1" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="loop" /> 繰り返し</label>
          <label class="ttt-check"><input type="checkbox" id="trail" checked /> 軌跡</label>
          <label class="ttt-check"><input type="checkbox" id="ghost" /> 前回の軌跡を残す</label>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="obs" checked /> 障害物</label>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="thick">障害物の厚み <span id="thick-val">24</span> px</label>
          <input type="range" id="thick" class="ttt-range" min="8" max="80" value="24" step="1" />
        </div>
        <div class="controls-group-paint gl-params url-share-row">
          <button type="button" id="btn-copy-url" class="btn btn-ghost">この設定のURLをコピー</button>
        </div>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="物理 · 加速度と重力"></footer>
  <script type="module" src="../js/accel-gravity.js"></script>
</body>
</html>
