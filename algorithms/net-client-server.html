<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="サーバ権威と速度キャップによるチート対策の入口。" />
  <title>クライアント・サーバ — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="net-client-server"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 通信 / クライアント・サーバ</p>
      <h1>クライアント・サーバ（権威）</h1>
      <p class="page-header-lead">
        クライアントが位置を<strong>主張</strong>し、サーバが maxSpeed で
        <strong>受理／クランプ</strong>する。前段:
        <a href="net-p2p-demo.html">P2P</a> ·
        <a href="net-prediction.html">予測</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>最終的なゲーム状態はサーバが決める（権威）</li>
          <li>速度チートは変位上限で拒否できる</li>
          <li>拒否時はクライアントを権威位置へ寄せる</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="cs-canvas" class="gl-canvas" width="640" height="260" tabindex="0"></canvas>
        <div id="cs-stats" class="coord-readout"></div>
        <div id="cs-log" class="es-log-panel" role="log"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="control-row">
          <button type="button" id="btn-play" class="btn btn-primary">再生</button>
          <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
        </div>
        <p class="footer-muted">← → / A D で移動</p>
        <label class="ttt-check"><input type="checkbox" id="cheat" /> チート速度（×約2.7）</label>
        <label class="controls-label" for="latency">遅延 ms <span id="lat-val">100</span></label>
        <input type="range" id="latency" class="ttt-range" min="0" max="350" value="100" step="10" />
        <label class="controls-label" for="max-speed">サーバ maxSpeed <span id="max-val">180</span></label>
        <input type="range" id="max-speed" class="ttt-range" min="60" max="400" value="180" step="10" />
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Networking · サーバ権威"></footer>
  <script type="module" src="../js/net-client-server.js"></script>
</body>
</html>
