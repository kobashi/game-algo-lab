      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 空間探索 / Sweep and Prune</p>
      <h1>Sweep and Prune</h1>
      <p class="page-header-lead">
        1 軸の区間をソートし、<strong>重なる区間だけ</strong>を Broad 候補にする。

          <li>黄線 = X が重なる候補、赤線 = 2D AABB も重なる</li>

      </div>

            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>

        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="count-n">個数 n <span id="n-val">18</span></label>
          <input type="range" id="count-n" class="ttt-range" min="4" max="40" value="18" step="1" />
        </div>
      </aside>
    </div>
    <section class="code-section">
