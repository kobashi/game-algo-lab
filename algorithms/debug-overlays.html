<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デバッグ可視化 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="debug-overlays"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 設計・品質 / デバッグ可視化</p>
      <h1>デバッグ可視化</h1>
      <p class="page-header-lead">
        本番描画の上に <strong>コライダー・速度・AI 状態</strong>を重ねる。
        関連: <a href="collision.html">AABB</a> · <a href="behavior-tree.html">BT</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>ゲーム本体と Debug レイヤを分離する</li>
          <li>フラグで ON/OFF（リリースでは無効化しやすい）</li>
          <li>典型: AABB 枠、速度矢印、状態ラベル、グリッド</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="do-canvas" class="gl-canvas" width="640" height="320"></canvas>
        <div id="do-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="controls-group-paint gl-params">
          <div class="control-row">
            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
          </div>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="ov-col" checked /> コライダー</label>
          <label class="ttt-check"><input type="checkbox" id="ov-vel" checked /> 速度</label>
          <label class="ttt-check"><input type="checkbox" id="ov-ai" checked /> AI 状態</label>
          <label class="ttt-check"><input type="checkbox" id="ov-grid" /> グリッド</label>
        </div>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="品質 · デバッグ可視化"></footer>
  <script type="module" src="../js/debug-overlays.js"></script>
</body>
</html>
