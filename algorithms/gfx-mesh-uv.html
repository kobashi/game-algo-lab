<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="メッシュ・UV・マテリアルの可視化。" />
  <title>メッシュ・UV・マテリアル — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="gfx-mesh-uv"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / ゲーム CG / メッシュ</p>
      <h1>メッシュ・UV・マテリアル</h1>
      <p class="page-header-lead">
        四角形 = 2 三角形。頂点の <strong>UV</strong> でテクスチャを貼り、
        オフセット・スケール・色（マテリアル）を変える。
        前段: <a href="gfx-gpu-concepts.html">GPU パイプライン</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>インデックスが頂点を三角形に組む</li>
          <li>UV (0〜1) がテクスチャ空間</li>
          <li>タイリング = UV スケール &gt; 1</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="mesh-canvas" class="gl-canvas" width="720" height="400"></canvas>
        <div id="mesh-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <label class="controls-label" for="u-off">U offset <span id="u-val">0.00</span></label>
        <input type="range" id="u-off" class="ttt-range" min="-1" max="1" value="0" step="0.02" />
        <label class="controls-label" for="v-off">V offset <span id="v-val">0.00</span></label>
        <input type="range" id="v-off" class="ttt-range" min="-1" max="1" value="0" step="0.02" />
        <label class="controls-label" for="uv-scale">UV scale <span id="scale-val">1.00</span></label>
        <input type="range" id="uv-scale" class="ttt-range" min="0.25" max="4" value="1" step="0.05" />
        <label class="controls-label" for="tint">マテリアル色</label>
        <input type="color" id="tint" value="#ffffff" />
        <label class="ttt-check"><input type="checkbox" id="wire" checked /> ワイヤー表示</label>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Graphics · Mesh/UV"></footer>
  <script type="module" src="../js/gfx-mesh-uv.js"></script>
</body>
</html>
