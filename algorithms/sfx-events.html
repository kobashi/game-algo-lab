<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>イベントと効果音 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="sfx-events"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / サウンド / イベントと効果音</p>
      <h1>イベントと効果音</h1>
      <p class="page-header-lead">
        ゲームイベントを Emit → SFX が購読してトーン再生。
        前段: <a href="event-system.html">イベントシステム</a>。
      </p>
    </div>
    <div class="gl-layout">
      <section class="gl-main">
        <h2 class="gl-block-title">ゲーム風イベント</h2>
        <div class="control-row">
          <button type="button" id="btn-jump" class="btn btn-primary">Jump</button>
          <button type="button" id="btn-land" class="btn btn-ghost">Land</button>
          <button type="button" id="btn-hit" class="btn btn-ghost">Hit</button>
          <button type="button" id="btn-pick" class="btn btn-ghost">Pickup</button>
        </div>
        <h2 class="gl-block-title">直接 Emit</h2>
        <div id="sfx-btns" class="control-row" style="flex-wrap:wrap;gap:0.35rem"></div>
        <h2 class="gl-block-title">ログ</h2>
        <div id="sfx-log" class="es-log-panel" role="log"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <label class="ttt-check"><input type="checkbox" id="mute" /> ミュート（ログのみ）</label>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="sfx-ev">対象イベント</label>
          <select id="sfx-ev" class="bandit-select"></select>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="sfx-freq">周波数 <span id="sfx-freq-val">440</span> Hz</label>
          <input type="range" id="sfx-freq" class="ttt-range" min="80" max="1200" value="440" step="10" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="sfx-dur">長さ <span id="sfx-dur-val">0.08</span> s</label>
          <input type="range" id="sfx-dur" class="ttt-range" min="0.02" max="0.5" value="0.08" step="0.01" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="sfx-gain">音量 <span id="sfx-gain-val">0.08</span></label>
          <input type="range" id="sfx-gain" class="ttt-range" min="0" max="0.3" value="0.08" step="0.01" />
        </div>
        <div class="controls-group-paint gl-params url-share-row">
          <button type="button" id="btn-copy-url" class="btn btn-ghost">この設定のURLをコピー</button>
        </div>
        <p class="footer-muted">選択中のイベントを Emit すると、上の周波数・長さ・音量で鳴ります。config の値は既定です。</p>
        <p class="footer-muted">初回クリックで AudioContext が起動します。無音環境はミュートでログ確認。</p>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Audio · SFX イベント"></footer>
  <script type="module" src="../js/sfx-events.js"></script>
</body>
</html>
