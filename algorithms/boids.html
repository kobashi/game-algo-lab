<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boids — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="steering" data-active="boids"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / ステアリング / Boids</p>
      <h1>Boids / Flocking</h1>
      <p class="page-header-lead">
        <strong>分離 · 整列 · 結合</strong>の 3 力。ON/OFF と重みで群れの質感が変わる。
        前段: <a href="steering-seek-flee.html">Seek</a> · <a href="steering-wander-avoid.html">Wander</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>分離: 近すぎる個体から離れる</li>
          <li>整列: 近傍の速度平均に合わせる</li>
          <li>結合: 近傍の重心へ向かう</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="bo-canvas" class="gl-canvas" width="640" height="360"></canvas>
        <div id="bo-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="controls-group-paint gl-params">
          <div class="control-row">
            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
          </div>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="count-n">個体数 <span id="n-val">40</span></label>
          <input type="range" id="count-n" class="ttt-range" min="5" max="100" value="40" step="1" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="perception">知覚半径 <span id="perc-val">55</span></label>
          <input type="range" id="perception" class="ttt-range" min="20" max="120" value="55" step="5" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="on-sep" checked /> 分離 w=<span id="sep-val">1.4</span></label>
          <input type="range" id="w-sep" class="ttt-range" min="0" max="3" value="1.4" step="0.1" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="on-ali" checked /> 整列 w=<span id="ali-val">1.0</span></label>
          <input type="range" id="w-ali" class="ttt-range" min="0" max="3" value="1.0" step="0.1" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="ttt-check"><input type="checkbox" id="on-coh" checked /> 結合 w=<span id="coh-val">0.9</span></label>
          <input type="range" id="w-coh" class="ttt-range" min="0" max="3" value="0.9" step="0.1" />
        </div>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="ステアリング · Boids"></footer>
  <script type="module" src="../js/boids.js"></script>
</body>
</html>
