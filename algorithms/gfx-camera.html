<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2D フォローカメラとワールド／スクリーン座標。" />
  <title>カメラと投影 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="gfx-camera"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / ゲーム CG / カメラ</p>
      <h1>カメラと投影（2D フォロー）</h1>
      <p class="page-header-lead">
        ワールド座標 → スクリーン = world − camera。デッドゾーン付き追従。
        前段: <a href="coordinates.html">座標</a> ·
        <a href="gfx-sprite-2d.html">2D スプライト</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>プレイヤーの world 座標はカメラと独立</li>
          <li>デッドゾーン内ではカメラが動かない</li>
          <li>follow 係数で滑らかさ（レール/一眼レフ感）を調整</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="cam-canvas" class="gl-canvas" width="720" height="320" tabindex="0"></canvas>
        <div id="cam-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="control-row">
          <button type="button" id="btn-play" class="btn btn-primary">再生</button>
          <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
        </div>
        <p class="footer-muted">← → / A D で移動</p>
        <label class="controls-label" for="follow">追従係数 <span id="follow-val">0.08</span></label>
        <input type="range" id="follow" class="ttt-range" min="0.02" max="0.5" value="0.08" step="0.01" />
        <label class="controls-label" for="dead">デッドゾーン px <span id="dead-val">40</span></label>
        <input type="range" id="dead" class="ttt-range" min="0" max="160" value="40" step="5" />
        <label class="controls-label" for="speed">再生速度 <span id="speed-val">1.0</span>×</label>
        <input type="range" id="speed" class="ttt-range" min="0.1" max="1" value="1" step="0.1" />
        <label class="ttt-check"><input type="checkbox" id="loop" /> 繰り返し</label>
        <label class="ttt-check"><input type="checkbox" id="trail" checked /> 軌跡</label>
        <div class="controls-group-paint gl-params url-share-row">
          <button type="button" id="btn-copy-url" class="btn btn-ghost">この設定のURLをコピー</button>
        </div>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Graphics · カメラ"></footer>
  <script type="module" src="../js/gfx-camera.js"></script>
</body>
</html>
