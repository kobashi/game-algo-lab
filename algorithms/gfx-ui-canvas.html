<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UI の Anchor・Pivot・解像度対応。" />
  <title>UI 描画 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="intro" data-active="gfx-ui-canvas"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / ゲーム CG / UI</p>
      <h1>UI 描画（Canvas・Anchor・Pivot）</h1>
      <p class="page-header-lead">
        親画面の <strong><span class="term" data-term="anchor">Anchor</span></strong> に貼り、要素の <strong><span class="term" data-term="pivot">Pivot</span></strong> を原点に<span class="term" data-term="offset">オフセット</span>。
        <span class="term" data-term="resolution">解像度</span>を変えても端に追従する。前段: <a href="gfx-camera.html?course=intro">カメラと投影（2D フォロー）</a>。次: <a href="sfx-events.html?course=intro">イベントと効果音</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li><span class="term" data-term="anchor">Anchor</span> = 親の<span class="term" data-term="normalized-coords">正規化座標</span>（0〜1）</li>
          <li><span class="term" data-term="pivot">Pivot</span> = 自分のどの点を Anchor+<span class="term" data-term="offset">Offset</span> に合わせるか</li>
          <li><span class="term" data-term="resolution">解像度</span>変更で絶対 px 固定 UI は破綻しやすい</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="ui-canvas" class="gl-canvas" width="640" height="360" tabindex="0"></canvas>
        <div id="ui-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <label class="controls-label" for="res">仮想<span class="term" data-term="resolution">解像度</span></label>
        <select id="res" class="bandit-select">
          <option value="640x360">640×360</option>
          <option value="800x450">800×450</option>
          <option value="480x320">480×320</option>
          <option value="960x540">960×540</option>
        </select>
        <label class="controls-label" for="vieww">幅（連続） <span id="vieww-val">640</span> px</label>
        <input type="range" id="vieww" class="ttt-range" min="320" max="960" value="640" step="10" />
        <label class="controls-label" for="anchor"><span class="term" data-term="anchor">Anchor</span> プリセット</label>
        <select id="anchor" class="bandit-select">
          <option value="top-left">左上</option>
          <option value="top-right">右上</option>
          <option value="center">中央</option>
          <option value="bottom-right" selected>右下</option>
          <option value="bottom-stretch">下中央</option>
        </select>
        <label class="controls-label" for="pivot-x"><span class="term" data-term="pivot">Pivot</span> X <span id="pivot-x-val">0.50</span></label>
        <input type="range" id="pivot-x" class="ttt-range" min="0" max="1" value="0.5" step="0.05" />
        <label class="controls-label" for="pivot-y">Pivot Y <span id="pivot-y-val">0.50</span></label>
        <input type="range" id="pivot-y" class="ttt-range" min="0" max="1" value="0.5" step="0.05" />
        <label class="controls-label" for="off-x"><span class="term" data-term="offset">Offset</span> X / Y（px。ボタンのドラッグでも変わる）</label>
        <div class="control-row">
          <input type="number" id="off-x" class="mc-num" min="-1000" max="1000" step="1" value="-20" aria-label="Offset X" />
          <input type="number" id="off-y" class="mc-num" min="-1000" max="1000" step="1" value="-20" aria-label="Offset Y" />
        </div>
        <div class="controls-group-paint gl-params url-share-row">
          <button type="button" id="btn-copy-url" class="btn btn-ghost">この設定のURLをコピー</button>
        </div>
        <p class="footer-muted">ボタンをドラッグして <span class="term" data-term="offset">Offset</span> を変更。</p>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Graphics · UI"></footer>
  <script type="module" src="../js/gfx-ui-canvas.js"></script>
</body>
</html>
