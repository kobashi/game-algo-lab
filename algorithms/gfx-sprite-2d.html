      <h1>2D スプライト</h1>
      <p class="page-header-lead">
        簡易<strong>スプライトシート</strong>のフレーム切替と、

        <label class="ttt-check"><input type="checkbox" id="use-sort" checked /> Y ソート（奥→手前）</label>

        <p class="footer-muted">キャラをドラッグして Y を変えると前後が切り替わる。</p>
      </aside>
