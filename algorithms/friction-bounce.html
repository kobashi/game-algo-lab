<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>摩擦・反発 — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="physics" data-active="friction-bounce"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 物理・判定 / 摩擦・反発</p>
      <h1>摩擦・反発</h1>
      <p class="page-header-lead">
        床ヒットで <strong>vy を反発係数で縮めて反転</strong>。接地中は<strong>摩擦で vx 減衰</strong>。
        前段: <a href="accel-gravity.html">加速度と重力</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>e=1 に近いほど高く跳ね、e=0 でくっつく</li>
          <li>摩擦が大きいと水平運動がすぐ止まる</li>
          <li>壁ヒットにも同じ e を適用（簡易）</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="fb-canvas" class="gl-canvas" width="640" height="360"></canvas>
        <div id="fb-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="controls-group-paint gl-params">
          <div class="control-row">
            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-kick" class="btn btn-ghost">キック</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
          </div>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="restitution">反発 e <span id="rest-val">0.65</span></label>
          <input type="range" id="restitution" class="ttt-range" min="0" max="1" value="0.65" step="0.05" />
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="friction">摩擦 <span id="fric-val">3.5</span></label>
          <input type="range" id="friction" class="ttt-range" min="0" max="12" value="3.5" step="0.5" />
        </div>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="物理 · 摩擦・反発"></footer>
  <script type="module" src="../js/friction-bounce.js"></script>
</body>
</html>
