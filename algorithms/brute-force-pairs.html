<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="spatial" data-active="brute-force-pairs"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / 空間探索 / 総当たり</p>
      <h1>総当たり O(n²)</h1>
      <p class="page-header-lead">
        全ペアを検査するベースライン。検査回数 = <strong>n(n−1)/2</strong>。
        次: <a href="uniform-grid.html">一様グリッド</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>n を倍にすると検査は約4倍</li>
          <li>赤線は実際に重なったペア</li>
          <li>空間分割は「この検査数を減らす」ための技法</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="bf-canvas" class="gl-canvas" width="640" height="360"></canvas>

        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="controls-group-paint gl-params">
          <div class="control-row">
            <button type="button" id="btn-play" class="btn btn-primary">再生</button>
            <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
          </div>
        </div>
        <div class="controls-group-paint gl-params">
          <label class="controls-label" for="count-n">個数 n <span id="n-val">24</span></label>
          <input type="range" id="count-n" class="ttt-range" min="4" max="80" value="24" step="1" />
        </div>
      </aside>
    </div>
    <section class="code-section">
