<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BGM イントロとループ区間の再生ヘッド。" />
  <title>BGM ループ — Game Algo Lab</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="topic-body">
  <header class="site-header" id="site-header" data-nav="explain" data-active="bgm-loop"></header>
  <main class="container container-wide topic-main">
    <div class="page-header page-header-compact">
      <p class="breadcrumb"><a href="../index.html">ホーム</a> / サウンド / BGM ループ</p>
      <h1>BGM ループ / イントロ＋ループ</h1>
      <p class="page-header-lead">
        再生ヘッドが <strong>イントロ</strong> を1回通り、その後は
        <strong>loopStart〜loopEnd</strong> だけを繰り返す。
        関連: <a href="audio-bus-ducking.html">バスとダッキング</a>。
      </p>
    </div>
    <details class="lesson-details" open>
      <summary>このデモで学ぶこと</summary>
      <div class="lesson-box lesson-box-nested">
        <ul>
          <li>曲の先頭から毎回戻るとイントロが繰り返されて不自然</li>
          <li>loopEnd 到達で playhead = loopStart</li>
          <li>実アセットではサンプル境界のクロスフェードが必要になることも</li>
        </ul>
      </div>
    </details>
    <div class="gl-layout">
      <section class="gl-main">
        <canvas id="bgm-canvas" class="gl-canvas" width="720" height="220"></canvas>
        <div id="bgm-stats" class="coord-readout"></div>
        <div id="status" class="status-log" role="status">準備完了</div>
      </section>
      <aside class="gl-side">
        <div class="control-row">
          <button type="button" id="btn-play" class="btn btn-primary">再生</button>
          <button type="button" id="btn-reset" class="btn btn-ghost">リセット</button>
        </div>
        <label class="controls-label" for="intro-sec">イントロ秒 <span id="intro-val">2.0</span></label>
        <input type="range" id="intro-sec" class="ttt-range" min="0.5" max="6" value="2" step="0.1" />
        <label class="controls-label" for="loop-sec">ループ秒 <span id="loop-val">4.0</span></label>
        <input type="range" id="loop-sec" class="ttt-range" min="1" max="12" value="4" step="0.1" />
        <label class="ttt-check"><input type="checkbox" id="mute" /> 区間切替ビープをミュート</label>
      </aside>
    </div>
    <section class="code-section">
      <h2>C# 実装例</h2>
      <pre class="code-block" id="csharp-sample"><code>// …</code></pre>
    </section>
  </main>
  <footer class="site-footer" id="site-footer" data-note="Audio · BGM ループ"></footer>
  <script type="module" src="../js/bgm-loop.js"></script>
</body>
</html>
